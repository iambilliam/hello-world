<style>
/* Layout: one phone screen — header, verse set in type that fits the space left
   above the keyboard, and the typing tray at the bottom. Tokens follow the
   Letterpress prototype's Classical design system (deliberately light-only, like paper). */
:root {
  --color-bg: #f3f2f2;
  --color-surface: #eae9e9;
  --color-text: #201f1d;
  --color-accent: #b68235;
  --color-divider: color-mix(in srgb, #201f1d 16%, transparent);
  --color-neutral-300: #d7d3d3;
  --color-neutral-400: #bab6b6;
  --color-neutral-500: #9b9797;
  --color-neutral-600: #7d7979;
  --color-neutral-900: #2d2b2b;
  --color-accent-200: #ffe3bf;
  --color-accent-300: #facb8d;
  --color-accent-600: #a06f24;
  --color-accent-700: #7d5411;
  --color-accent-800: #5a3b0a;
  --color-accent-900: #3a270d;
  --shadow-lg: 0 12px 32px color-mix(in srgb, #2d2b2b 22%, transparent);

  --font-heading: "Cormorant Garamond", Georgia, "Times New Roman", serif;
  --font-body: "Lora", Georgia, "Times New Roman", serif;

  --space-1: 4.6px;
  --space-2: 9.2px;
  --space-3: 13.8px;
  --space-4: 18.4px;
  --space-6: 27.6px;
  --radius-md: 4px;
  --radius-lg: 7px;
  color-scheme: light;
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--color-bg); color: var(--color-text); font-family: var(--font-body); }
@keyframes caret { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
@keyframes tray-in { from { opacity: 0; transform: translateY(.18em); } }
@keyframes listen { 0%, 100% { opacity: 1; } 50% { opacity: .4; } }

#app {
  position: fixed; inset: 0;
  display: grid; grid-template-rows: auto 1fr auto;
  font-family: var(--font-heading);
  user-select: none; -webkit-user-select: none; cursor: default;
  touch-action: manipulation; -webkit-tap-highlight-color: transparent;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

header {
  display: flex; justify-content: space-between; align-items: center; gap: var(--space-3);
  padding-block: calc(var(--space-3) + env(safe-area-inset-top, 0px)) var(--space-3);
  font-family: var(--font-body); font-size: 10px; letter-spacing: .16em; text-transform: uppercase;
  color: var(--color-neutral-600);
}
.modes, .actions { display: flex; align-items: center; gap: var(--space-3); }
.mode, .new-verse {
  all: unset; cursor: pointer; padding: 6px 0 3px; border-bottom: 1px solid transparent;
  letter-spacing: inherit; text-transform: inherit; transition: color 200ms, border-color 200ms;
}
.mode { color: var(--color-neutral-500); }
.mode[aria-pressed="true"] { color: var(--color-text); border-color: var(--color-accent); }
.new-verse { color: var(--color-accent-700); border-color: var(--color-accent); }
.icon-btn { all: unset; cursor: pointer; display: inline-flex; padding: 4px; border-radius: var(--radius-md); color: var(--color-neutral-600); transition: color 200ms; }
.icon-btn:hover { color: var(--color-accent-700); }
.icon-btn svg { display: block; width: 16px; height: 16px; }
.mode:focus-visible, .new-verse:focus-visible, .icon-btn:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 3px; }

main {
  min-height: 0; overflow: hidden;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: var(--space-4);
}
.meta {
  display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: var(--space-1) var(--space-3);
  font-family: var(--font-body); font-size: 10px; letter-spacing: .16em; text-transform: uppercase;
  color: var(--color-neutral-600); font-variant-numeric: tabular-nums;
}
.ref { color: var(--color-accent-700); }
.sep { width: 1px; height: 10px; background: var(--color-divider); }
.marks { display: flex; gap: var(--space-1); }
.marks i { display: block; width: 14px; height: 1px; background: var(--color-neutral-300); transition: background 300ms; }
.marks i.on { background: var(--color-accent); }

#verse {
  width: 100%;
  display: flex; flex-wrap: wrap; justify-content: center;
  column-gap: .32em; row-gap: .12em;
  line-height: 1.08; font-weight: 400; font-size: 32px;
}
.word { position: relative; display: flex; white-space: nowrap; }
.slot { position: relative; display: inline-block; padding: 0 .015em; transition: color 400ms; }
.slot i { position: absolute; left: .08em; right: .08em; bottom: -.04em; height: 1px; transition: background 300ms; }
.punct { display: inline-block; transition: color 400ms; }
/* The hesitation fuse: an accent rule under the word you are on, burning down to the reveal. */
.fuse { position: absolute; left: .08em; right: .08em; bottom: -.04em; height: 1.5px; background: var(--color-accent); transform-origin: left center; pointer-events: none; }

.hint {
  margin: 0; min-height: 1.6em; max-width: 34ch; text-align: center;
  font-family: var(--font-body); font-style: italic; font-size: 13px; color: var(--color-neutral-600);
}

footer {
  display: flex; flex-direction: column; align-items: center; gap: var(--space-2);
  padding-block: var(--space-2) calc(var(--space-4) + env(safe-area-inset-bottom, 0px));
}
.rule { width: min(420px, 86%); height: 1px; background: var(--color-divider); }
#tray {
  display: flex; align-items: center; justify-content: center; gap: 2px;
  min-height: 44px; max-width: 100%; overflow: hidden; font-size: 34px; line-height: 1;
}
#tray span[data-tray] { display: inline-block; min-width: .45em; text-align: center; transition: color 200ms; animation: tray-in 200ms cubic-bezier(.2,.8,.2,1); }
#cursor { display: inline-flex; align-items: center; }
#caret { display: inline-block; width: 1px; height: .85em; background: var(--color-accent); animation: caret 1.1s steps(1) infinite; }
#mic { display: inline-flex; margin-left: .1em; color: var(--color-neutral-300); transition: color 300ms; }
#mic svg { display: block; width: 22px; height: 22px; }
#mic.on { color: var(--color-accent); animation: listen 1.6s ease-in-out infinite; }
.prompt {
  margin: 0; font-family: var(--font-body); font-size: 10px; letter-spacing: .16em; text-transform: uppercase;
  color: var(--color-neutral-500);
}

#input {
  position: fixed; left: 50%; bottom: 0; width: 2px; height: 2px; opacity: .01;
  font-size: 16px; border: 0; padding: 0; margin: 0; outline: none;
  color: transparent; caret-color: transparent; background: transparent; pointer-events: none;
}
#layer { position: fixed; inset: 0; z-index: 30; pointer-events: none; overflow: hidden; }

/* — animation settings: a sheet from the bottom on phones, a dialog on wider screens — */
.sheet-backdrop {
  position: fixed; inset: 0; z-index: 20; display: grid; align-items: end;
  background: color-mix(in srgb, var(--color-neutral-900) 50%, transparent);
}
.sheet {
  width: 100%; max-height: 88%; overflow: auto;
  display: flex; flex-direction: column; gap: var(--space-4);
  padding: var(--space-4) max(16px, env(safe-area-inset-left, 0px)) calc(var(--space-4) + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-right, 0px));
  background: var(--color-surface); border: 1px solid var(--color-divider); border-bottom: 0;
  border-radius: var(--radius-lg) var(--radius-lg) 0 0; box-shadow: var(--shadow-lg);
  font-family: var(--font-body); font-size: 13px; color: var(--color-text);
}
@media (min-width: 600px) {
  .sheet-backdrop { align-items: center; justify-items: center; padding: var(--space-4); }
  .sheet { width: min(440px, 100%); border-radius: var(--radius-lg); border-bottom: 1px solid var(--color-divider); padding: var(--space-4); }
}
.sheet-head { display: flex; align-items: baseline; justify-content: space-between; }
.sheet-head h2 { margin: 0; font-family: var(--font-heading); font-weight: 600; font-size: 22px; letter-spacing: -0.015em; }
.sheet-done { all: unset; cursor: pointer; font-family: var(--font-heading); font-weight: 600; font-size: 14px; color: var(--color-accent); padding: 6px 8px; border-radius: var(--radius-md); }
.sheet-done:hover { background: color-mix(in srgb, var(--color-accent) 10%, transparent); }
.sheet-done:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }
.stage {
  position: relative; height: 132px; cursor: pointer;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: var(--space-3);
  background: var(--color-bg); border: 1px solid var(--color-divider); border-radius: var(--radius-md);
  font-family: var(--font-heading); user-select: none; -webkit-user-select: none;
}
.stage-word { font-size: 44px; line-height: 1.08; }
.stage-tray { display: flex; gap: 2px; min-height: 1em; font-size: 24px; line-height: 1; color: var(--color-neutral-500); }
.stage-tray span { display: inline-block; min-width: .45em; text-align: center; }
.sheet-rule { height: 1px; margin: 0; border: 0; background: var(--color-divider); }
.stage-cue { position: absolute; right: 10px; bottom: 8px; margin: 0; font-size: 9px; letter-spacing: .14em; text-transform: uppercase; color: var(--color-neutral-500); }
#groups { display: flex; flex-direction: column; gap: var(--space-4); }
.group { border: 0; padding: 0; margin: 0; min-width: 0; display: flex; flex-direction: column; gap: var(--space-2); }
.group legend { padding: 0; margin-bottom: var(--space-2); font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--color-accent); }
.group legend span { color: var(--color-neutral-500); letter-spacing: .04em; text-transform: none; margin-left: var(--space-2); }
.seg { display: flex; overflow: hidden; border: 1px solid var(--color-divider); border-radius: var(--radius-md); }
.seg-opt { position: relative; flex: 1; display: flex; align-items: center; justify-content: center; padding: 8px 6px; cursor: pointer; font-family: var(--font-heading); font-weight: 600; font-size: 14px; white-space: nowrap; }
.seg-opt + .seg-opt { border-left: 1px solid var(--color-divider); }
.seg-opt input { position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none; }
.seg-opt:has(input:checked) { color: var(--color-accent); box-shadow: inset 0 0 0 1px var(--color-accent); }
.seg-opt:not(:has(input:checked)):hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }
.seg-opt:has(input:focus-visible) { outline: 2px solid var(--color-accent); outline-offset: -2px; }
.note { margin: 0; min-height: 1.5em; font-style: italic; font-size: 12px; color: var(--color-neutral-600); }

@media (prefers-reduced-motion: reduce) {
  #caret, #mic.on, #tray span[data-tray] { animation: none; }
}
</style>
</head>
<body>
<div id="app">
  <header>
    <span>Letterpress</span>
    <span class="modes" role="group" aria-label="Input">
      <button class="mode" data-mode="typing" type="button" aria-pressed="true">Type</button>
      <button class="mode" data-mode="voice" type="button" aria-pressed="false">Speak</button>
    </span>
    <span class="actions">
      <button class="new-verse" id="newVerse" type="button">New verse</button>
      <button class="icon-btn" id="settingsBtn" type="button" aria-label="Animation settings"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" aria-hidden="true"><path d="M2 4h12M2 8h12M2 12h12"></path><circle cx="10" cy="4" r="1.7" fill="var(--color-bg)"></circle><circle cx="5.5" cy="8" r="1.7" fill="var(--color-bg)"></circle><circle cx="11" cy="12" r="1.7" fill="var(--color-bg)"></circle></svg></button>
    </span>
  </header>
  <main id="main">
    <div class="meta">
      <span class="ref" id="ref"></span>
      <span class="sep"></span>
      <span id="passLabel"></span>
      <span class="marks" id="marks"><i></i><i></i><i></i></span>
    </div>
    <div id="verse" aria-live="polite"></div>
    <p class="hint" id="hint"></p>
  </main>
  <footer>
    <div class="rule"></div>
    <div id="tray"><span id="cursor"><span id="caret"></span><span id="mic" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"></rect><path d="M5 11a7 7 0 0 0 14 0M12 18v3"></path></svg></span></span></div>
    <p class="prompt" id="prompt"></p>
  </footer>
  <input id="input" aria-label="Type the verse" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false" inputmode="text" enterkeyhint="done">
</div>
<div id="layer"></div>
<div class="sheet-backdrop" id="settings" hidden>
  <section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="sheet-head">
      <h2 id="sheetTitle">Settings</h2>
      <button class="sheet-done" id="settingsDone" type="button">Done</button>
    </div>
    <div id="textGroup"></div>
    <hr class="sheet-rule">
    <div class="stage" id="stage" role="button" aria-label="Play the preview again">
      <div class="stage-word" id="stageWord"></div>
      <div class="stage-tray" id="stageTray"></div>
      <p class="stage-cue" id="stageCue">Tap to replay</p>
    </div>
    <div id="groups"></div>
  </section>
</div>

<script>

const ANIMS = {
  entry: { label: 'Entering', about: 'a word lands in the verse', options: {
    Arc: 'Letters lob in from the tray and settle with a ring.',
    Stamp: 'Pressed straight in, with a bloom of ink.',
    Ink: 'Droplets gather and pool into each letter.',
    Strike: 'Straight in, fast, landing with a jolt.',
  } },
  reveal: { label: 'Revealing', about: 'a word you hesitated on is shown', options: {
    Unfold: 'Letters tumble up into place, one by one.',
    Develop: 'The word sharpens as a light passes over it.',
    Bleed: 'Ink rises through the letters from the baseline.',
    Turn: 'Letters turn face up, like type set in the chase.',
  } },
  hide: { label: 'Hiding', about: 'the words clear for the next pass', options: {
    Fade: 'Letters dissolve, word by word.',
    Erase: 'An eraser sweeps across the page.',
    Scatter: 'The type loosens and falls away.',
    Sink: 'Letters sink into the paper, one after another.',
  } },
};

const $ = id => document.getElementById(id);
const app = $('app'), main = $('main'), verseEl = $('verse'), trayEl = $('tray'), cursorEl = $('cursor');
const caretEl = $('caret'), micEl = $('mic'), layer = $('layer'), input = $('input'), hintEl = $('hint');

const S = {
  verse: null, words: [], filled: [], pass: 0, tray: [], revealed: new Set(), fuseWord: -1,
  done: false, typed: false, missed: '', focused: false, mode: 'typing', voiceError: '', settingsOpen: false,
  anim: { entry: 'Arc', reveal: 'Unfold', hide: 'Fade' }, source: 'scripture',
};
const reserved = new Set();
let seq = 0, bag = [];
try {
  if (localStorage.getItem('letterpress-mode') === 'voice' && SR) S.mode = 'voice';
  const saved = JSON.parse(localStorage.getItem('letterpress-anim') || '{}');
  for (const k in ANIMS) if (saved[k] in ANIMS[k].options) S.anim[k] = saved[k];
  if (localStorage.getItem('letterpress-source') in SOURCES) S.source = localStorage.getItem('letterpress-source');
} catch (err) { /* no storage */ }
const noun = () => SOURCES[S.source].noun;

// Shuffle-bag so every verse comes up once before any repeats.
function randomVerse() {
  const list = SOURCES[S.source].list;
  if (!bag.length) {
    bag = list.map((_, i) => i).filter(i => !S.verse || list[i] !== S.verse);
    for (let i = bag.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [bag[i], bag[j]] = [bag[j], bag[i]]; }
  }
  return list[bag.pop()];
}
function setSource(name) {
  if (!(name in SOURCES) || name === S.source) return;
  S.source = name; bag = [];
  try { localStorage.setItem('letterpress-source', name); } catch (err) { /* no storage */ }
  layer.textContent = ''; ghosts = [];
  loadVerse(randomVerse());
  verseEl.animate([{ opacity: 0, transform: 'translateY(12px)' }, { opacity: 1, transform: 'translateY(0)' }], { duration: 480, easing: 'cubic-bezier(.2,.8,.2,1)' });
}

// Each word keeps its punctuation for display; only letters are typed or said.
function parse(text) {
  return text.split(/\s+/).filter(Boolean).map(raw => {
    let n = 0;
    const parts = [...raw].map(ch => /[a-z]/i.test(ch) ? { ch, letter: true, i: n++ } : { ch, letter: false });
    return { parts, target: raw.toLowerCase().replace(/[^a-z]/g, '') };
  }).filter(w => w.target);
}

function loadVerse(v, pass = 0) {
  S.verse = v; S.words = parse(v[1]);
  reset(pass);
}
function reset(pass) {
  reserved.clear(); disarmHesitation();
  Object.assign(S, { pass, tray: [], revealed: new Set(), done: false, missed: '' });
  S.filled = S.words.map(w => Array(w.target.length).fill(false));
  buildVerse(); clearInput(); paint(); fit(); armHesitation();
}

// A word of the verse: letter slots (each with its rule underneath) and punctuation.
function makeWord(parts, wi) {
  const wordEl = document.createElement('div');
  wordEl.className = 'word'; wordEl.dataset.word = wi;
  for (const p of parts) {
    const span = document.createElement('span');
    if (p.letter) {
      span.className = 'slot'; span.dataset.slot = `${wi}-${p.i}`;
      span.appendChild(document.createElement('i'));
      span.appendChild(document.createTextNode(p.ch));
    } else {
      span.className = 'punct'; span.textContent = p.ch;
    }
    wordEl.appendChild(span);
  }
  return wordEl;
}
function buildVerse() {
  verseEl.textContent = '';
  S.words.forEach((w, wi) => verseEl.appendChild(makeWord(w.parts, wi)));
  $('ref').textContent = S.verse[0];
}

const wordDone = i => S.filled[i] && S.filled[i].every(Boolean);
function nextWord() {
  for (let i = 0; i < S.words.length; i++) if (!wordDone(i) && !reserved.has(i)) return i;
  return -1;
}
const engaged = () => !S.settingsOpen && (S.mode === 'voice' ? voiceWant : (S.focused || !touch));

const VOICE_ERRORS = {
  unsupported: 'Voice input isn’t available in this browser. Typing still works.',
  blocked: 'The microphone is blocked here. Allow it in the browser, or open the page in a browser tab.',
  nomic: 'No microphone was found.',
  network: 'Voice recognition needs a connection.',
  stalled: 'Listening keeps stopping. Tap to try again.',
};

// Apply the current state to the verse's letter slots and the labels.
function paint() {
  const nw = nextWord(), { pass, done, revealed, mode } = S;
  S.words.forEach((w, wi) => {
    const wordEl = verseEl.children[wi]; if (!wordEl) return;
    const complete = wordDone(wi), current = !done && wi === nw;
    for (const el of wordEl.children) {
      if (el.classList.contains('fuse')) continue;
      if (el.classList.contains('punct')) {
        el.style.color = complete ? 'var(--color-text)' : 'var(--color-neutral-400)';
        continue;
      }
      const i = Number(el.dataset.slot.split('-')[1]);
      const on = S.filled[wi][i];
      const shown = pass === 0 || (pass === 1 && i === 0) || revealed.has(wi);
      el.style.color = on ? 'var(--color-text)' : 'transparent';
      el.style.webkitTextStroke = on || !shown ? '0px transparent' : '1px var(--color-neutral-400)';
      // While the fuse burns it carries the accent; the dashes under it go quiet.
      el.firstChild.style.background = current && S.fuseWord !== wi ? 'var(--color-accent)' : (!on && pass > 0 ? 'var(--color-neutral-300)' : 'transparent');
    }
  });
  $('passLabel').textContent = PASSES[pass];
  [...$('marks').children].forEach((m, i) => m.classList.toggle('on', i <= pass));
  const voice = mode === 'voice';
  hintEl.textContent = done ? (pass < 2 ? 'Once more, with less to go on.' : `Well set. A new ${noun()} is coming.`)
    : voice && S.voiceError ? VOICE_ERRORS[S.voiceError]
    : S.missed ? (voice ? `Heard “${S.missed}”. Not quite.` : 'Not quite.')
    : revealed.has(nw) ? 'Revealed. Set it in place.'
    : !S.typed ? (voice ? `Say the ${noun()}. Each word finds its place as you go.` : 'Type each word in order. Space sends it to its place.')
    : pass === 1 ? 'Only the initials remain.' : pass === 2 ? 'From memory. Hesitate, and the word is shown.' : '';
  $('newVerse').textContent = `New ${noun()}`;
  $('prompt').textContent = voice ? (S.voiceError ? 'Voice unavailable' : voiceWant ? 'Listening' : 'Tap anywhere to listen')
    : touch && !S.focused ? 'Tap anywhere to begin' : 'Type a word, then space';
  caretEl.style.background = S.focused || !touch ? 'var(--color-accent)' : 'var(--color-neutral-300)';
  caretEl.hidden = voice; micEl.hidden = !voice; micEl.classList.toggle('on', voice && voiceWant && !S.voiceError);
  for (const b of document.querySelectorAll('.mode')) b.setAttribute('aria-pressed', String(b.dataset.mode === mode));
}

// — the tray —
// Letters waiting below the verse, in groups of one word each. Typing fills one group;
// listening can show a few heard words at once. Group 0 is the word up next.
function setTrayWords(words) {
  const old = new Map(S.tray.map(t => [t.g + ':' + t.i, t]));
  const next = [];
  words.forEach((w, g) => [...w].forEach((ch, i) => {
    const o = old.get(g + ':' + i);
    next.push(o && o.ch === ch ? o : { id: ++seq, ch, g, i });
  }));
  if (words.join('')) { S.typed = true; if (ghosts.length) dropGhosts(ghosts, true); } // clear a missed word out of the way
  S.tray = next; renderTray();
}
const setTray = letters => setTrayWords(letters ? [letters] : []);
function removeGroup0() { S.tray = S.tray.filter(t => t.g !== 0); for (const t of S.tray) t.g--; }
function clearInput() { S.tray = []; input.value = ''; consumed = 0; consumedText = ''; renderTray(); }

function renderTray() {
  // Keep the letters already in the tray (their ids survive setTrayWords) so only new ones animate in.
  const ids = new Set(S.tray.map(t => t.id));
  for (const el of [...trayEl.querySelectorAll('[data-tray]')]) if (!ids.has(Number(el.dataset.tray))) el.remove();
  const nextTray = el => { const n = el.nextElementSibling; return n && n.dataset.tray ? n : null; };
  let node = trayEl.querySelector('[data-tray]');
  for (const t of S.tray) {
    if (node && Number(node.dataset.tray) === t.id) { node = nextTray(node); continue; }
    const span = document.createElement('span');
    span.dataset.tray = t.id; span.textContent = t.ch;
    trayEl.insertBefore(span, node || cursorEl);
  }
  const typed = S.tray.filter(t => t.g === 0).map(t => t.ch).join(''), nw = nextWord();
  const onTrack = typed && nw >= 0 && S.words[nw].target.startsWith(typed);
  for (const t of S.tray) {
    const el = trayEl.querySelector(`[data-tray="${t.id}"]`);
    el.style.color = t.g === 0 && onTrack ? 'var(--color-accent)' : 'var(--color-neutral-500)';
    el.style.marginLeft = t.g > 0 && t.i === 0 ? '.35em' : '';
  }
}

// Size the verse to the largest type that fits the space left on screen.
function fit() {
  const others = [...main.children].filter(el => el !== verseEl);
  const gap = parseFloat(getComputedStyle(main).rowGap) || 0;
  const availH = main.clientHeight - others.reduce((h, el) => h + el.offsetHeight, 0) - gap * others.length;
  const availW = main.clientWidth;
  let lo = 14, hi = 72;
  for (let k = 0; k < 9; k++) {
    const mid = (lo + hi) / 2;
    verseEl.style.fontSize = mid + 'px';
    if (verseEl.scrollHeight <= availH && verseEl.scrollWidth <= availW) lo = mid; else hi = mid;
  }
  verseEl.style.fontSize = Math.floor(lo) + 'px';
}

// — typing —
function focusInput() { input.focus({ preventScroll: true }); }

// The hidden input is a running buffer that the keyboard owns. We never change its
// value mid-verse: rewriting it resets the keyboard, which breaks swipe typing and
// suggestion taps. Instead we remember how much of it has already been sent (and what
// that text was, in case the keyboard edits inside it); the words after that point,
// up to the last space, get sent, and whatever follows the last space is the tray.
let consumed = 0, consumedText = '';
const lettersOf = str => str.replace(/[^a-zA-Z]/g, '').toLowerCase();
function syncFromInput() {
  if (S.done || S.settingsOpen || nextWord() < 0) return;
  const v = input.value;
  let keep = 0; const lim = Math.min(consumed, v.length);
  while (keep < lim && v[keep] === consumedText[keep]) keep++;
  consumed = keep;
  const parts = v.slice(consumed).split(/\s+/), current = parts.pop();
  for (const part of parts) {
    if (S.done || nextWord() < 0) break;
    const letters = lettersOf(part);
    if (letters) { setTray(letters); submit(); }
  }
  consumed = v.length - current.length; consumedText = v.slice(0, consumed);
  setTray(lettersOf(current)); paint();
  armHesitation(); // typing is not hesitating
  // The last open word sets itself as soon as it's spelled.
  const open = S.words.map((_, i) => i).filter(i => !wordDone(i) && !reserved.has(i));
  if (open.length === 1 && S.words[open[0]].target === lettersOf(current)) sendTray();
}
// Send whatever is in the tray (space or enter from a keyboard that didn't put one in the buffer).
function sendTray() { consumed = input.value.length; consumedText = input.value; submit(); }
function backspace() { input.value = input.value.slice(0, -1); syncFromInput(); }
function typeChar(ch) {
  if (ch === ' ' || ch === '\n') return sendTray();
  if (!/^[a-zA-Z]$/.test(ch)) return;
  input.value += ch; syncFromInput();
}

// Send group 0 of the tray to the word up next: it flies into place, or misses.
function submit() {
  const group = S.tray.filter(t => t.g === 0);
  if (!group.length) return;
  const typed = group.map(t => t.ch).join(''), target = nextWord();
  if (target < 0) { removeGroup0(); renderTray(); return; }
  if (S.words[target].target !== typed) return miss(group);
  reserved.add(target);
  S.missed = '';
  flyWord(group, target);
  armHesitation(); // the clock now runs for the word after this one
}

// Letters of a missed word, lifted into the overlay until they drop (sooner if typing resumes).
let ghosts = [];
function dropGhosts(list, fast) {
  ghosts = ghosts.filter(g => !list.includes(g));
  list.forEach((g, i) => {
    if (reduceMotion) return g.remove();
    g.getAnimations().forEach(a => a.cancel());
    g.animate([{ opacity: 1, transform: 'translateY(0)' }, { opacity: 0, transform: 'translateY(14px)' }], { duration: fast ? 180 : 260, delay: fast ? 0 : i * 25, easing: 'ease-in', fill: 'forwards' }).onfinish = () => g.remove();
  });
}

function miss(group) {
  const cur = nextWord();
  S.missed = group.map(t => t.ch).join('');
  const mine = group.map(t => trayEl.querySelector(`[data-tray="${t.id}"]`)).filter(Boolean).map(el => {
    const r = el.getBoundingClientRect(), g = document.createElement('span');
    g.textContent = el.textContent;
    g.style.cssText = `position:fixed;left:${r.left}px;top:${r.top}px;width:${r.width}px;height:${r.height}px;display:flex;align-items:center;justify-content:center;font-family:var(--font-heading);font-size:${getComputedStyle(el).fontSize};line-height:1;color:var(--color-neutral-500)`;
    layer.appendChild(g); return g;
  });
  ghosts.push(...mine);
  removeGroup0(); renderTray(); paint();
  if (reduceMotion || S.mode === 'voice') dropGhosts(mine, false); // a misheard word just slips away; no scolding
  else {
    mine.forEach(g => g.animate([{ transform: 'translateX(0)' }, { transform: 'translateX(-5px)' }, { transform: 'translateX(5px)' }, { transform: 'translateX(-3px)' }, { transform: 'translateX(0)' }], { duration: 320, easing: 'ease-out' }));
    setTimeout(() => dropGhosts(mine, false), 420);
  }
  const wordEl = cur >= 0 && verseEl.children[cur];
  if (wordEl) wordEl.animate([{ opacity: 1 }, { opacity: .35 }, { opacity: 1 }, { opacity: .35 }, { opacity: 1 }], { duration: 700, easing: 'ease-in-out' });
}

// — hesitation —
// A hidden word gets HESITATION_MS of quiet before it is shown. Any typing or speech
// restarts the clock; sending a word starts it for the next one.
let hesitation = 0, fuseEl = null;
function armHesitation(fresh = true) {
  const nw = nextWord();
  if (!fresh && hesitation && S.fuseWord === nw) return;
  disarmHesitation();
  if (S.done || nw < 0 || !engaged()) return;
  if (S.pass === 0 || S.revealed.has(nw)) return; // nothing hidden, nothing to reveal
  S.fuseWord = nw;
  fuseEl = document.createElement('b'); fuseEl.className = 'fuse';
  verseEl.children[nw].appendChild(fuseEl);
  if (!reduceMotion) fuseEl.animate([{ transform: 'scaleX(1)' }, { transform: 'scaleX(0)' }], { duration: HESITATION_MS, easing: 'linear', fill: 'forwards' });
  hesitation = setTimeout(() => { disarmHesitation(); revealWord(nw); }, HESITATION_MS);
  paint();
}
function disarmHesitation() {
  clearTimeout(hesitation); hesitation = 0; S.fuseWord = -1;
  if (fuseEl) { fuseEl.remove(); fuseEl = null; }
}
function revealWord(wi) {
  S.revealed.add(wi); S.missed = ''; paint();
  const wordEl = verseEl.children[wi];
  if (wordEl && !reduceMotion) animateReveal(S.anim.reveal, wordEl);
}

// ═══ Animations ═══
// Each takes a style name from ANIMS and works on any word built by makeWord, so the
// settings sheet can play them on its sample word exactly as the verse does.
const fixed = (left, top, w, h) => `position:fixed;left:${left}px;top:${top}px;width:${w}px;height:${h}px;`;

// Entering: letters travel from the tray (pairs[i].a) into their slots (pairs[i].to).
function animateEntry(style, pairs, { onLand, done }) {
  const ms = FLIGHT_MS, last = pairs.length - 1;
  const stagger = style === 'Stamp' ? 0 : Math.min(70, 400 / Math.max(pairs.length, 1));
  let left = pairs.length;
  const land = (m, idx) => { onLand(m, idx === last); if (--left <= 0) done(); };
  pairs.forEach((m, idx) => {
    const { ch, a, b, fromSize, toSize } = m, delay = idx * stagger;
    const dx = (a.left + a.width / 2) - (b.left + b.width / 2), dy = (a.top + a.height / 2) - (b.top + b.height / 2);
    if (style === 'Ink') {
      const ax = a.left + a.width / 2, ay = a.top + a.height / 2, bx = b.left + b.width / 2, by = b.top + b.height / 2;
      const count = 9; let drops = count;
      for (let k = 0; k < count; k++) {
        const dot = document.createElement('div'), sz = 2 + Math.random() * 3;
        const sx = (Math.random() - .5) * a.width, sy = (Math.random() - .5) * a.height;
        const ex = (Math.random() - .5) * b.width * .8, ey = (Math.random() - .5) * b.height * .6;
        const bend = (Math.random() - .5) * 160;
        dot.style.cssText = `${fixed(ax + sx, ay + sy, sz, sz)}margin:${-sz / 2}px;border-radius:50%;background:var(--color-accent);opacity:0`;
        layer.appendChild(dot);
        const tx = bx + ex - (ax + sx), ty = by + ey - (ay + sy);
        dot.animate([
          { transform: 'translate(0,0) scale(1)', opacity: 1 },
          { transform: `translate(${tx * .5 + bend}px, ${ty * .5}px) scale(1.2)`, opacity: .9, offset: .5 },
          { transform: `translate(${tx}px, ${ty}px) scale(.3)`, opacity: 0 }
        ], { duration: ms * (.85 + Math.random() * .3), delay: delay + k * 18, easing: 'cubic-bezier(.4,0,.2,1)', fill: 'forwards' }).onfinish = () => { dot.remove(); if (--drops === 0) land(m, idx); };
      }
      return;
    }
    const outer = document.createElement('div');
    outer.style.cssText = `${fixed(b.left, b.top, b.width, b.height)}transform-origin:center;will-change:transform;transform:translate(${dx}px, ${dy}px) scale(${fromSize / toSize})`;
    const inner = document.createElement('span');
    inner.textContent = ch;
    inner.style.cssText = `display:flex;align-items:center;justify-content:center;width:100%;height:100%;font-family:var(--font-heading);font-size:${toSize}px;line-height:1;color:var(--color-accent);will-change:transform`;
    outer.appendChild(inner); layer.appendChild(outer);
    if (style === 'Strike') {
      const quick = 240, beat = idx * 55; // one after another, like hammers
      outer.animate([{ transform: `translate(${dx}px, ${dy}px) scale(${fromSize / toSize})` }, { transform: 'translate(0, 0) scale(1)' }], { duration: quick, delay: beat, easing: 'cubic-bezier(.7,0,1,.6)', fill: 'forwards' });
      inner.animate([{ color: 'var(--color-accent)' }, { color: 'var(--color-accent-900)' }], { duration: quick, delay: beat, fill: 'forwards' }).onfinish = () => { outer.remove(); land(m, idx); };
      return;
    }
    if (style === 'Stamp') {
      outer.animate([{ transform: `translate(${dx}px, ${dy}px) scale(${fromSize / toSize})` }, { transform: 'translate(0, 0) scale(1)' }], { duration: ms, easing: 'cubic-bezier(.3,.9,.25,1)', fill: 'forwards' });
      inner.animate([{ transform: 'scale(1)' }, { transform: 'scale(1.18)', offset: .8 }, { transform: 'scale(1)' }], { duration: ms, easing: 'ease-in-out', fill: 'forwards' });
      inner.animate([{ color: 'var(--color-accent)', filter: 'blur(0px)', opacity: 1 }, { color: 'var(--color-accent)', filter: 'blur(2px)', opacity: .7, offset: .5 }, { color: 'var(--color-accent-800)', filter: 'blur(0px)', opacity: 1 }], { duration: ms, fill: 'forwards' }).onfinish = () => { outer.remove(); land(m, idx); };
      return;
    }
    const arc = Math.min(140, Math.hypot(dx, dy) * 0.3);
    outer.animate([{ transform: `translate(${dx}px, ${dy}px) scale(${fromSize / toSize})` }, { transform: 'translate(0, 0) scale(1)' }], { duration: ms, delay, easing: 'cubic-bezier(.45,0,.15,1)', fill: 'forwards' });
    inner.animate([{ transform: 'translateY(0) rotate(-6deg)', easing: 'ease-out' }, { transform: `translateY(${-arc}px) rotate(2deg)`, offset: .5, easing: 'ease-in' }, { transform: 'translateY(0) rotate(0deg)' }], { duration: ms, delay, fill: 'forwards' });
    inner.animate([{ color: 'var(--color-accent)', filter: 'blur(0px)' }, { color: 'var(--color-accent)', filter: 'blur(0.6px)', offset: .5 }, { color: 'var(--color-accent-700)', filter: 'blur(0px)' }], { duration: ms, delay, fill: 'forwards' }).onfinish = () => { outer.remove(); land(m, idx); };
  });
}

// The landing itself: how a slot takes its letter (burst = the word's last letter).
function merge(style, to, b, burst) {
  const cx = b.left + b.width / 2, cy = b.top + b.height / 2;
  if (style === 'Strike') {
    to.animate([
      { transform: 'translateY(0) scale(1)', color: 'var(--color-accent-900)' },
      { transform: 'translateY(.07em) scale(1.05)', color: 'var(--color-accent-900)', offset: .25 },
      { transform: 'translateY(0) scale(1)', color: 'var(--color-text)' }
    ], { duration: 340, easing: 'cubic-bezier(.2,.8,.3,1)' });
    const mark = document.createElement('div'); // the impression under the letter
    mark.style.cssText = `${fixed(b.left + b.width * .1, b.top + b.height * .9, b.width * .8, 2)}background:var(--color-accent-800);opacity:0`;
    layer.appendChild(mark);
    mark.animate([{ opacity: .9, transform: 'scaleX(1.2)' }, { opacity: 0, transform: 'scaleX(.6)' }], { duration: 320, easing: 'ease-out', fill: 'forwards' }).onfinish = () => mark.remove();
    if (burst) to.parentElement.animate([{ transform: 'translateY(0)' }, { transform: 'translateY(.04em)', offset: .3 }, { transform: 'translateY(0)' }], { duration: 300, easing: 'ease-out' });
    return;
  }
  if (style === 'Stamp') {
    to.animate([
      { transform: 'scale(1.22) translateY(-0.03em)', filter: 'blur(3px)', opacity: .5, color: 'var(--color-accent-800)' },
      { transform: 'scale(.97) translateY(0.01em)', filter: 'blur(0px)', opacity: 1, color: 'var(--color-accent-900)', offset: .45 },
      { transform: 'scale(1) translateY(0)', filter: 'blur(0px)', opacity: 1, color: 'var(--color-text)' }
    ], { duration: 560, easing: 'cubic-bezier(.2,.9,.3,1)' });
    const r = Math.max(b.width, b.height) * 1.4, bloom = document.createElement('div');

// — wiring —
input.addEventListener('input', syncFromInput);
input.addEventListener('focus', () => { S.focused = true; paint(); armHesitation(); });
input.addEventListener('blur', () => { S.focused = false; paint(); if (S.mode === 'typing') disarmHesitation(); });
window.addEventListener('keydown', e => {
  if (S.settingsOpen) { if (e.key === 'Escape') closeSettings(); return; }
  if (e.metaKey || e.ctrlKey || e.altKey || S.mode === 'voice') return;
  if (e.key === 'Enter') { e.preventDefault(); if (!S.done) sendTray(); return; }
  if (e.target === input) return;
  if (e.key === 'Backspace') return backspace();
  if (e.key === ' ') { e.preventDefault(); if (!S.done) sendTray(); return; }
  if (/^[a-zA-Z]$/.test(e.key)) { e.preventDefault(); typeChar(e.key); }
});
app.addEventListener('click', begin);

for (const b of document.querySelectorAll('.mode, .new-verse, .icon-btn')) b.addEventListener('pointerdown', e => e.preventDefault()); // keep the keyboard as it is
for (const b of document.querySelectorAll('.mode')) b.addEventListener('click', e => { e.stopPropagation(); setMode(b.dataset.mode); });
$('newVerse').addEventListener('click', e => {
  e.stopPropagation();
  layer.textContent = ''; ghosts = [];
  loadVerse(randomVerse());
  verseEl.animate([{ opacity: 0, transform: 'translateY(12px)' }, { opacity: 1, transform: 'translateY(0)' }], { duration: 480, easing: 'cubic-bezier(.2,.8,.2,1)' });
  begin();
});
$('settingsBtn').addEventListener('click', e => { e.stopPropagation(); openSettings(); });
$('settingsDone').addEventListener('click', closeSettings);
settingsEl.addEventListener('click', e => { if (e.target === settingsEl) closeSettings(); });
stageEl.addEventListener('click', () => preview(lastPreview));

// Keep the app inside the visible area when the on-screen keyboard opens.
function onViewport() {
  const vv = window.visualViewport;
  if (vv) { app.style.top = vv.offsetTop + 'px'; app.style.height = vv.height + 'px'; app.style.bottom = 'auto'; window.scrollTo(0, 0); }
  fit();
}
if (window.visualViewport) { visualViewport.addEventListener('resize', onViewport); visualViewport.addEventListener('scroll', onViewport); }
window.addEventListener('resize', fit);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden') { disarmHesitation(); if (voiceWant) { stopListening(); resumeVoice = true; } }
  else { if (resumeVoice && S.mode === 'voice' && !S.settingsOpen) { resumeVoice = false; startListening(); } armHesitation(); }
});

loadVerse(randomVerse());
if (S.mode === 'typing' && !touch) focusInput();
</script>
</body>
</html>
